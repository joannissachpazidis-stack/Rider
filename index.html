<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rider-Ablage</title>
  <meta name="theme-color" content="#14161b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a href="#/concerts" class="logo"><span class="logo-mark">🎚</span> Rider-Ablage</a>
    <div class="top-actions">

  </header>
  <main id="app"></main>
  <nav class="tabs">
    <a href="#/concerts" data-tab="concerts"><span>🎤</span>Konzerte</a>
    <a href="#/bands" data-tab="bands"><span>🎸</span>Bands</a>
    <a href="#/stagebox" data-tab="stagebox"><span>🎛</span>Stagebox</a>

    <a href="#/more" data-tab="more"><span>☁️</span>Cloud</a>
  </nav>
  <div id="drop-overlay" hidden>
    <div class="drop-box">
      <div class="drop-icon">📄</div>
      <b>Rider hier loslassen</b>
      <span>Band, Art und Version werden automatisch erkannt</span>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="db.js"></script>
  <script src="cloud.js"></script>
  <script src="smart.js"></script>
  <script src="patch.js"></script>
  <script src="patch-ui.js"></script>
  <script src="schedule.js"></script>
  <script src="app.js"></script>

</html>
